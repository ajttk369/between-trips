<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>회원 관리 · 여행의 사이</title><link rel="icon" href="/favicon-32.png"><link rel="stylesheet" href="/admin.css?v=2"><script type="module" src="/admin.js?v=2"></script></head><body><header><a class="brand" href="/"><img src="/travel-logo.png" alt="" width="38" height="38"><span>여행의 사이<small>관리자</small></span></a><button id="logout" type="button" hidden>로그아웃</button></header><main id="admin-root" aria-live="polite"><p>관리자 화면을 불러오고 있습니다.</p></main><dialog id="user-editor" aria-labelledby="editor-title"><form id="user-form"><div class="dialog-head"><h2 id="editor-title">회원 정보 수정</h2><button type="button" data-close aria-label="닫기">✕</button></div><div class="dialog-body"><p class="notice">로그인 이메일·비밀번호 변경은 같은 Supabase Auth 계정을 쓰는 다른 앱에도 적용됩니다.</p><label>회원 고유 ID<input id="user-id" readonly><small>여행·예약 기록과 연결된 고유 ID는 변경하지 않습니다.</small></label><label>이름<input id="user-name" name="name" maxlength="40" required autocomplete="off"></label><label>로그인 아이디 (이메일)<input id="user-email" name="email" type="email" maxlength="254" required autocomplete="off"></label><label>새 비밀번호<input id="user-password" name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" placeholder="변경할 때만 10자 이상 입력"><small>기존 비밀번호는 조회할 수 없습니다. 비워두면 유지됩니다.</small></label><p id="editor-error" class="error" role="alert"></p></div><div class="dialog-foot"><button type="button" data-close>닫기</button><button class="primary" type="submit">변경 내용 저장</button></div></form></dialog><div id="admin-toast" role="status"></div></body></html>
